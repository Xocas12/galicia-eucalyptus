[project]
name = "eucalyptus-impact"
version = "0.1.0"
description = "Machine learning and geospatial intelligence to measure the impact of eucalyptus plantations in Galicia on native-forest loss, wildfire and water."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Real-data ingestion (Sentinel-2 via STAC, vector layers, rasters). Not needed for the
# synthetic end-to-end run, which is pure numpy/scikit-learn.
geo = [
    "geopandas>=0.14",
    "rasterio>=1.3",
    "pystac-client>=0.7",
    "stackstac>=0.5",
    "xarray>=2024.1",
    "requests>=2.31",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
euc = "eucalyptus_impact.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eucalyptus_impact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "RUF"]
ignore = ["E501", "RUF012"]
