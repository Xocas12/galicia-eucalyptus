name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the venv at a known path so every step can use it, and match the README's
  # `uv venv && uv pip install -e '.[dev]'` rather than installing into the runner's
  # Python, which is externally managed and refuses --system.
  UV_PROJECT_ENVIRONMENT: .venv

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - name: ruff check
        run: uv run --python 3.11 --with 'ruff>=0.6' ruff check .
      - name: ruff format --check
        run: uv run --python 3.11 --with 'ruff>=0.6' ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: install
        # The dev extra only. It carries pyproj, so the coordinate-transform tests run; the
        # heavy geo stack (rasterio, geopandas, stackstac) stays in the optional `geo` extra.
        # The one test that needs geopandas skips itself when it is absent.
        run: |
          uv venv --python 3.11
          uv pip install -e '.[dev]'
      - name: pytest
        run: uv run pytest -ra -q

  smoke:
    # The fast config is a 4 km synthetic end-to-end run. It is the cheapest check that the
    # pipeline still produces a report rather than only that its parts import.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: install
        run: |
          uv venv --python 3.11
          uv pip install -e '.[dev]'
      - name: end-to-end smoke run
        run: uv run euc run --config configs/fast.yaml
      - name: the run must have written a report
        run: |
          set -euo pipefail
          out=$(uv run python -c "import yaml;print(yaml.safe_load(open('configs/fast.yaml',encoding='utf-8')).get('output_dir','outputs/fast'))")
          echo "output_dir: $out"
          test -s "$out/report.md"    || { echo "no report.md under $out"; ls -R "$out" || true; exit 1; }
          test -s "$out/metrics.json" || { echo "no metrics.json under $out"; exit 1; }
          echo "report.md: $(wc -l < "$out/report.md") lines"

  ci-ok:
    # Single required check, so branch protection does not have to list every job.
    needs: [lint, test, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: fail if any job did not succeed
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} smoke=${{ needs.smoke.result }}"
          [ "${{ needs.lint.result }}" = "success" ] || exit 1
          [ "${{ needs.test.result }}" = "success" ] || exit 1
          [ "${{ needs.smoke.result }}" = "success" ] || exit 1
